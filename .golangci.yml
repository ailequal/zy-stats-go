version: "2"
run:
  timeout: 3m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - wrapcheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
      ignore-package-globs:
        - github.com/ailequal/zy-stats-go/* # internal packages already prefix their errors
    gosec:
      excludes:
        - G402 # InsecureSkipVerify is a documented requirement (self-signed router cert)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec # tests read fixtures by variable path (G304)
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
