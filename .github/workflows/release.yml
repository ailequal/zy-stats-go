# Release: on a pushed version tag (vX.Y.Z), check the code, build the
# archives with `just dist`, smoke-test every binary on its own platform,
# attest their build provenance and publish a GitHub release whose notes come
# from CHANGELOG.md. It can also be started by hand for an existing tag.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.0
        required: true
        type: string

# No token permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Expressions go through env, never straight into run scripts.
  TAG: ${{ inputs.tag || github.ref_name }}
  JUST_VERSION: "1.58.0"

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release builds start from a clean cache

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Check that CHANGELOG.md has an entry for the version
        run: |
          if ! grep -q "^## \[${TAG#v}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG#v}] - YYYY-MM-DD' entry"
            exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          just test

      - name: Lint and check formatting
        run: just lint-docker

      - name: Build the archives
        run: just dist

      - name: Check the version stamped into the binaries
        run: |
          tar -xzf "dist/zy-stats-go-$TAG-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/zy-stats-go-$TAG-linux-amd64/zy-stats-go" --version | grep -q "^$TAG ("

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    strategy:
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-amd64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-amd64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify the checksum, unpack and run the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd dist
          name="zy-stats-go-$TAG-$TARGET"
          case "$TARGET" in
            windows-*) archive="$name.zip"; bin="$name/zy-stats-go.exe" ;;
            *) archive="$name.tar.gz"; bin="$name/zy-stats-go" ;;
          esac

          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          grep " $archive\$" SHA256SUMS | $sum -c -

          case "$archive" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath ." ;;
            *) tar -xzf "$archive" ;;
          esac

          version=$("./$bin" --version)
          echo "$version"
          [[ $version == "$TAG ("*", ${TARGET/-//})" ]] || { echo "::error::unexpected version line"; exit 1; }
          "./$bin" --help | head -1

          # An unreachable router must fail with exit code 1 and a clear message.
          set +e
          out=$("./$bin" --server-url https://127.0.0.1:1 --username u --password p --interval 1 --once 2>&1)
          code=$?
          set -e
          echo "$out"
          [[ $code -eq 1 && $out == *"Failed to connect"* ]] || { echo "::error::unexpected result ($code)"; exit 1; }

  release:
    name: Publish the release
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the archives
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations
      artifact-metadata: write # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Attest the build provenance of the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # The version's section of CHANGELOG.md, without its heading and
          # without leading or trailing blank lines.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on && /^[[:space:]]*$/ { if (seen) blank++; next }
            on { while (blank > 0) { print ""; blank-- } print; seen = 1 }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::the CHANGELOG.md entry for ${TAG#v} is empty"
            exit 1
          fi
          cat >> "$notes" <<EOF

          ### Downloads

          | System | Archive |
          | --- | --- |
          | Linux (x86-64) | \`zy-stats-go-$TAG-linux-amd64.tar.gz\` |
          | Linux (ARM64, e.g. Raspberry Pi 4/5 with a 64-bit OS) | \`zy-stats-go-$TAG-linux-arm64.tar.gz\` |
          | macOS (Apple Silicon) | \`zy-stats-go-$TAG-darwin-arm64.tar.gz\` |
          | macOS (Intel) | \`zy-stats-go-$TAG-darwin-amd64.tar.gz\` |
          | Windows (x86-64) | \`zy-stats-go-$TAG-windows-amd64.zip\` |
          | Windows (ARM64) | \`zy-stats-go-$TAG-windows-arm64.zip\` |

          Each archive holds the \`zy-stats-go\` binary, \`.env.example\`, the README, the changelog and the license. Unpack it, copy \`.env.example\` to \`.env\` next to the binary and fill in your router credentials.

          The binaries are not signed by Apple or Microsoft: on macOS run \`xattr -d com.apple.quarantine zy-stats-go\` once (or right-click it and choose Open); on Windows choose **More info, Run anyway** in the SmartScreen prompt.

          Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`) and its build provenance with \`gh attestation verify <archive> --repo $REPO\`.
          EOF
          cat "$notes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
